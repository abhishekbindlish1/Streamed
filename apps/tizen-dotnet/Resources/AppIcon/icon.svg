<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2a1414" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0c0c10" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="playGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dadada" stop-opacity="1"/>
    </linearGradient>

    <radialGradient id="liveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a3a" stop-opacity="1"/>
      <stop offset="60%" stop-color="#e50914" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a8060f" stop-opacity="1"/>
    </radialGradient>

    <filter id="liveDotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="playShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bgGlow)"/>

  <!-- Three subtle "row" lines hinting at the listing layout -->
  <g opacity="0.18">
    <rect x="80"  y="380" width="352" height="12" rx="3" fill="#ffffff"/>
    <rect x="80"  y="406" width="240" height="10" rx="3" fill="#ffffff"/>
    <rect x="80"  y="428" width="180" height="8"  rx="3" fill="#ffffff"/>
  </g>

  <!-- Centered play triangle -->
  <g filter="url(#playShadow)">
    <path d="M 188 144 L 372 248 L 372 264 L 188 368 Z" fill="url(#playGrad)"/>
  </g>

  <!-- Live dot — top-right with a soft red glow -->
  <g>
    <circle cx="404" cy="108" r="36" fill="#ff2a3a" filter="url(#liveDotGlow)" opacity="0.7"/>
    <circle cx="404" cy="108" r="22" fill="url(#liveGlow)"/>
    <circle cx="396" cy="100" r="6" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
