# csproj file path
csproj_file: StreamedTv.csproj

# Default profile, Tizen API version
profile: tv
api_version: "9.0"

# Build type [Debug/ Release/ Test]
build_type: Debug

# Output path for build
output_path: ""

# Signing profile to be used for Tizen package signing
# If value is empty: "", active signing profile will be used
# Else If value is ".", default signing profile will be used
signing_profile: ""

# files monitored for dirty/modified status
files:
  - Models/ApiModels.cs
  - Platforms/Tizen/TizenStreamPlayer.cs
  - Program.cs
  - Resources/AppIcon/icon.png
  - Services/IStreamPlayer.cs
  - Services/StreamRanker.cs
  - Services/StreamedCatalogService.cs
  - Services/StreamedEndpoints.cs
  - StreamedTv.csproj
  - tizen-manifest.xml

# project dependencies
deps: []
