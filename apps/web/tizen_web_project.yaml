# Project type [web_app, test_runner]
project_type: web_app

# Default profile, Tizen API version
profile: tv-samsung
api_version: "2.3"

# Build type [Debug/ Release/ Test]
build_type: Debug

# Output name for application
output_name: app

# Output path for build
output_path: ""

# Enable size optimization of wgt for web workspace
opt: false

# Signing profile to be used for Tizen package signing
# If value is empty: "", active signing profile will be used
# Else If value is ".", default signing profile will be used
signing_profile: ""

# list of certs in web project (.trust-anchor)
trust_anchor: []

# list of files in web project (.html,.css etc) and resources
files:
  - assets/profiles/avatar-0.svg
  - assets/profiles/avatar-1.svg
  - assets/profiles/avatar-2.svg
  - assets/profiles/avatar-3.svg
  - assets/profiles/avatar-4.svg
  - assets/profiles/avatar-5.svg
  - assets/profiles/avatar-6.svg
  - assets/profiles/avatar-7.svg
  - data/config.local.js
  - data/live-demo.json
  - data/sources.sample.json
  - data/team-db.js
  - icon.png
  - index.html
  - src/api.js
  - src/compat.js
  - src/compat.css
  - src/app.js
  - src/styles.css

# list of files to exclude based on the matched patterns
excludes:
  - .env*
  - .git/*
  - .github/*
  - .gitignore
  - .nvmrc
  - .DS_Store
  - .trust-anchor/*
  - '*.pem'
  - '*.key'
  - '*.p12'
  - '*.pfx'
  - README.md
  - docs/*
  - tests/*
  - scripts/*
  - dist/*
  - test-results/*
  - playwright-report/*
  - playwright.config.js
  - node_modules/*
  - package*.json
  - server.js
  - data/config.example.js
  - data/team-backfill.json
  - data/team-standings-cache.json
  - Build/*
  - Debug/*
  - Directory.Build.targets
  - Release/*
  - Test/*
  - \.Build/.*
  - \.buildResult/.*
  - \.csproj
  - \.externalToolBuilders/.*
  - \.gn
  - \.obj/.*
  - \.package/.*
  - \.project
  - \.rds_delta
  - \.sdk_delta.info
  - \.settings/.*
  - \.sign/.*
  - \.tizen-ui-builder-tool.xml
  - \.tproject
  - \.wgt
  - tizen_web_project.yaml
  - webUnitTest/*

# project dependencies
deps: []
