name: Native and backend CI

on:
  push:
    branches: ['**']
    paths:
      - 'apps/android/**'
      - 'apps/tizen-dotnet/**'
      - 'apps/web/package.json'
      - 'services/**'
      - 'tests/Streamed.Core.Tests/**'
      - 'scripts/android*'
      - 'scripts/setup-android-sdk.sh'
      - 'scripts/verify-dotnet-workloads.sh'
      - 'scripts/release-assets.js'
      - '.github/workflows/native.yml'
      - '.github/workflows/ci.yml'
      - '.nvmrc'
      - 'global.json'
      - 'NuGet.Config'
      - 'NuGet.config'
      - 'nuget.config'
      - 'Directory.*.props'
      - 'Directory.*.targets'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [api, extractor]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - run: go test ./...
        working-directory: services/${{ matrix.service }}

  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Streamed.Core.Tests/Streamed.Core.Tests.csproj
      - name: Compile Tizen 9 development package
        run: dotnet build apps/tizen-dotnet/StreamedTv.csproj -c Release
      - name: Prepare Tizen download and provenance
        run: node scripts/release-assets.js tizen
      - uses: actions/upload-artifact@v6
        with:
          name: tizen-distribution
          path: release-native/tizen/
          if-no-files-found: error


  android_build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Free unused preinstalled runner toolchains
        run: sudo rm -rf -- /opt/hostedtoolcache/CodeQL /usr/share/swift
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install MAUI Android and verify package signatures
        run: |
          dotnet workload install maui-android --skip-manifest-update
          bash scripts/verify-dotnet-workloads.sh
      - name: Install Android build dependencies
        run: bash scripts/setup-android-sdk.sh platform-tools 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build sandbox APK
        run: |
          dotnet build apps/android/StreamedTv.Android.csproj -c Debug -p:SandboxMode=true -p:RuntimeIdentifier=android-x64 -p:EmbedAssembliesIntoApk=true -p:AndroidPackageFormats=apk
          mkdir -p "$RUNNER_TEMP/streamed-apks"
          cp apps/android/bin/Debug/net10.0-android/android-x64/com.streamed.tv.android.sandbox-Signed.apk "$RUNNER_TEMP/streamed-apks/"
      - name: Build isolated pairing fixture APK
        run: |
          dotnet build apps/android/StreamedTv.Android.csproj -c Debug -p:SandboxMode=true -p:SandboxPairing=true -p:RuntimeIdentifier=android-x64 -p:EmbedAssembliesIntoApk=true -p:AndroidPackageFormats=apk
          cp apps/android/bin/Debug/net10.0-android/android-x64/com.streamed.tv.android.sandbox.pairing-Signed.apk "$RUNNER_TEMP/streamed-apks/"
      - name: Build ARM64 device development APK
        run: >-
          dotnet build apps/android/StreamedTv.Android.csproj -c Debug
          -p:RuntimeIdentifier=android-arm64
          -p:EmbedAssembliesIntoApk=true -p:AndroidPackageFormats=apk
      - name: Verify APK signatures and prepare downloads
        run: |
          # ApplicationId changes can clean previous variant outputs. Restore
          # the immutable copies from this build before collecting the release.
          mkdir -p apps/android/bin/Debug/net10.0-android/android-x64
          cp "$RUNNER_TEMP/streamed-apks/"*-Signed.apk apps/android/bin/Debug/net10.0-android/android-x64/
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify apps/android/bin/Debug/net10.0-android/android-x64/com.streamed.tv.android.sandbox-Signed.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify apps/android/bin/Debug/net10.0-android/android-x64/com.streamed.tv.android.sandbox.pairing-Signed.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify apps/android/bin/Debug/net10.0-android/android-arm64/com.streamed.tv.android-Signed.apk
          node scripts/release-assets.js android
      - uses: actions/upload-artifact@v6
        with:
          name: android-smoke-apks
          path: |
            apps/android/bin/Debug/net10.0-android/android-x64/com.streamed.tv.android.sandbox-Signed.apk
            apps/android/bin/Debug/net10.0-android/android-x64/com.streamed.tv.android.sandbox.pairing-Signed.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: android-distribution
          path: release-native/android/
          if-no-files-found: error

  android_test:
    needs: android_build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android-api28
            api: 28
            target: default
            width: 720
            height: 1280
            density: 240
            ram: 2048
          - name: android-tv-api36
            api: 36
            target: android-tv
            width: 1280
            height: 720
            density: 160
            ram: 3072
    steps:
      - uses: actions/checkout@v6
      - name: Free space for the system image and emulator
        run: sudo rm -rf -- /opt/hostedtoolcache/CodeQL /usr/share/swift "$ANDROID_HOME/ndk"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v7
        with:
          name: android-smoke-apks
          path: apps/android/bin/Debug/net10.0-android/android-x64/
      - name: Install official emulator and selected system image
        run: bash scripts/setup-android-sdk.sh platform-tools emulator 'system-images;android-${{ matrix.api }};${{ matrix.target }};x86_64'
      - name: Allow emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Remote navigation, real playback, Back and pairing regression checks
        timeout-minutes: 15
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/streamed-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name StreamedCi --package 'system-images;android-${{ matrix.api }};${{ matrix.target }};x86_64'
          sed -i -E '/^(hw\.(cpu\.ncore|ramSize|lcd\.(width|height|density))|disk\.dataPartition\.size)[[:space:]]*=/d' "$ANDROID_AVD_HOME/StreamedCi.avd/config.ini"
          cat >> "$ANDROID_AVD_HOME/StreamedCi.avd/config.ini" <<'CONFIG'
          hw.cpu.ncore=2
          hw.ramSize=${{ matrix.ram }}
          hw.lcd.width=${{ matrix.width }}
          hw.lcd.height=${{ matrix.height }}
          hw.lcd.density=${{ matrix.density }}
          disk.dataPartition.size=4G
          CONFIG
          bash scripts/android-ci-smoke.sh StreamedCi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-results-${{ matrix.name }}
          path: test-results/android/
          if-no-files-found: ignore
          retention-days: 7
