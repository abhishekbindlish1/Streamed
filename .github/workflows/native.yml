name: Native and backend CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [api, extractor]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - run: go test ./...
        working-directory: services/${{ matrix.service }}

  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Streamed.Core.Tests/Streamed.Core.Tests.csproj
      - name: Compile Tizen 9 development package
        run: dotnet build apps/tizen-dotnet/StreamedTv.csproj -c Release
      - name: Prepare Tizen download and provenance
        run: node scripts/release-assets.js tizen
      - uses: actions/upload-artifact@v6
        with:
          name: tizen-distribution
          path: release-native/tizen/
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install MAUI Android and verify package signatures
        run: |
          dotnet workload install maui-android --skip-manifest-update
          bash scripts/verify-dotnet-workloads.sh
      - name: Configure runner Android SDK and required packages
        run: |
          # ubuntu-24.04 includes the SDK, but sdkmanager is not on PATH.
          sdk_root="${ANDROID_HOME:?The runner Android SDK is required}"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdk_manager" ]]; then
            echo "::error::The runner is missing Android command-line tools at $sdk_manager"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdk_manager")" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$sdk_manager" --version
          # Process substitution preserves sdkmanager's exit status when yes
          # receives SIGPIPE after the final license prompt.
          if ! "$sdk_manager" --licenses < <(yes) > "$RUNNER_TEMP/android-licenses.log" 2>&1; then
            tail -n 10 "$RUNNER_TEMP/android-licenses.log" | sed 's/^/::error::/'
            exit 1
          fi
          if ! "$sdk_manager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-28;default;x86_64" > "$RUNNER_TEMP/android-sdk.log" 2>&1; then
            cat "$RUNNER_TEMP/android-sdk.log"
            tail -n 8 "$RUNNER_TEMP/android-sdk.log" | sed 's/^/::error::/'
            exit 1
          fi
          cat "$RUNNER_TEMP/android-sdk.log"
      - name: Build experimental fixture-only APK
        run: >-
          dotnet build apps/android/StreamedTv.Android.csproj -c Debug
          -p:SandboxMode=true -p:RuntimeIdentifier=android-x64
          -p:EmbedAssembliesIntoApk=true -p:AndroidPackageFormats=apk
      - name: Allow emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android sandbox startup and screenshot
        timeout-minutes: 12
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/streamed-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name StreamedCi --package 'system-images;android-28;default;x86_64'
          cat >> "$ANDROID_AVD_HOME/StreamedCi.avd/config.ini" <<'CONFIG'
          hw.cpu.ncore=2
          hw.ramSize=1536
          hw.lcd.width=1280
          hw.lcd.height=720
          hw.lcd.density=160
          CONFIG
          bash scripts/android-ci-smoke.sh StreamedCi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-startup-logs
          path: test-results/android/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build ARM64 device development APK
        run: >-
          dotnet build apps/android/StreamedTv.Android.csproj -c Debug
          -p:RuntimeIdentifier=android-arm64
          -p:EmbedAssembliesIntoApk=true -p:AndroidPackageFormats=apk
      - name: Verify APK signatures and prepare downloads
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify apps/android/bin/Debug/net10.0-android/android-x64/com.streamed.tv.android.sandbox-Signed.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify apps/android/bin/Debug/net10.0-android/android-arm64/com.streamed.tv.android-Signed.apk
          node scripts/release-assets.js android
      - uses: actions/upload-artifact@v6
        with:
          name: android-distribution
          path: release-native/android/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-sandbox-screenshots
          path: test-results/android/*.png
          if-no-files-found: ignore
