name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Unit and compatibility checks
        run: npm test
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Chromium 69 regression checks
        run: npm run test:legacy
      - name: Browser tests (desktop, 720p TV, 1080p TV)
        run: npm run test:browser
      - name: Upload browser reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
