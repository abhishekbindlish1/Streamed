name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Unit and compatibility checks
        run: npm test
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Chromium 69 regression checks
        run: npm run test:legacy
      - name: Browser tests (desktop, 720p TV, 1080p TV)
        run: npm run test:browser
      - name: Build and verify the LG webOS development package
        run: |
          npm run build:webos
          node scripts/release-assets.js webos
      - uses: actions/upload-artifact@v6
        with:
          name: webos-distribution
          path: release-native/webos/
          if-no-files-found: error
      - name: Save tested browser distribution
        uses: actions/upload-artifact@v6
        with:
          name: browser-distribution
          path: apps/web/dist/releases/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.repository.has_pages == true
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/site
      - name: Upload browser reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  native_release:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/native.yml
    secrets: inherit
    permissions:
      contents: read

  vendor_runtime_release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, native_release]
    uses: ./.github/workflows/vendor-tv.yml
    with:
      use_release_artifacts: true
    permissions:
      contents: read

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, native_release, vendor_runtime_release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v7
        with:
          name: browser-distribution
          path: incoming/browser
      - uses: actions/download-artifact@v7
        with:
          name: tizen-distribution
          path: incoming/tizen
      - uses: actions/download-artifact@v7
        with:
          name: android-distribution
          path: incoming/android
      - uses: actions/download-artifact@v7
        with:
          name: webos-distribution
          path: incoming/webos
      - name: Check provenance and assemble all-platform release
        run: node scripts/release-assets.js bundle
      - name: Publish all platform downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release/INSTALL.md
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --title "Streamed $RELEASE_TAG" --notes-file release/INSTALL.md
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "Streamed $RELEASE_TAG" --notes-file release/INSTALL.md
          fi

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.repository.has_pages == true
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy tested demo
        id: deployment
        uses: actions/deploy-pages@v4
